<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結帳資料模型</title>
<style>
:root{--paper:#f7f5ef;--ink:#203b55;--muted:#6b7980;--accent:#165e83;--accent-tint:#eaf1f4;--rule:#dce4e7;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:var(--sans)}.diagram-container{width:100%;overflow-x:auto}.diagram-container svg{display:block;width:100%;min-width:960px}@media print{.diagram-container{overflow:visible}.diagram-container svg{min-width:0}}.rel{fill:none;stroke:var(--muted);stroke-width:1.2}.entity{fill:#fff;stroke:var(--ink);stroke-width:1.2}.core{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5}.join{fill:rgba(32,59,85,.03);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}.head{fill:rgba(32,59,85,.04)}.corehead{fill:rgba(22,94,131,.10)}.tag{font:8px var(--mono);letter-spacing:1.25px;fill:var(--muted)}.name{font:600 14px var(--sans);fill:var(--ink)}.field{font:10px var(--mono);fill:var(--muted)}.key{font:600 10px var(--mono);fill:var(--ink)}.card{font:600 10px var(--mono);fill:var(--accent)}.relname{font:8px var(--mono);letter-spacing:.8px;fill:var(--muted)}.legend{font:8.5px var(--sans);fill:var(--muted)}
</style></head><body><div class="diagram-container"><svg viewBox="0 0 960 600" role="img" aria-labelledby="data-model-title data-model-desc" xmlns="http://www.w3.org/2000/svg"><title id="data-model-title">結帳系統資料模型</title><desc id="data-model-desc">訂單明細位於商品與訂單之間，訂單衍生付款紀錄與事件，庫存則與商品分離管理。</desc>
<rect width="960" height="600" fill="#f7f5ef"/>
<text x="40" y="44" class="tag">ER / DATA MODEL · BALANCED VIEW</text><text x="40" y="72" class="name" style="font-size:20px">結帳資料模型</text>
<!-- relationships first: every relationship has a distinct, non-overlapping route -->
<line class="rel" x1="200" y1="264" x2="300" y2="264"/><line class="rel" x1="460" y1="264" x2="600" y2="264"/><line class="rel" x1="120" y1="344" x2="120" y2="384"/><line class="rel" x1="680" y1="344" x2="680" y2="384"/><line class="rel" x1="760" y1="464" x2="800" y2="464"/>
<!-- cardinality labels sit clear of relationship strokes -->
<rect x="210" y="242" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="219" y="253" text-anchor="middle" class="card">1</text><rect x="272" y="242" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="281" y="253" text-anchor="middle" class="card">N</text><text x="244" y="232" text-anchor="middle" class="relname">SNAPSHOT</text>
<rect x="470" y="242" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="479" y="253" text-anchor="middle" class="card">N</text><rect x="572" y="242" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="581" y="253" text-anchor="middle" class="card">1</text><text x="530" y="232" text-anchor="middle" class="relname">BELONGS TO</text>
<rect x="130" y="352" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="139" y="363" text-anchor="middle" class="card">1</text><rect x="130" y="366" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="139" y="377" text-anchor="middle" class="card">1</text>
<rect x="690" y="352" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="699" y="363" text-anchor="middle" class="card">1</text><rect x="690" y="366" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="699" y="377" text-anchor="middle" class="card">N</text>
<rect x="770" y="442" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="779" y="453" text-anchor="middle" class="card">1</text><rect x="790" y="442" width="18" height="14" rx="2" fill="#f7f5ef"/><text x="799" y="453" text-anchor="middle" class="card">N</text>
<!-- products --> <rect class="entity" x="40" y="184" width="160" height="160" rx="6"/><rect class="head" x="40" y="184" width="160" height="40" rx="6"/><rect class="head" x="40" y="216" width="160" height="8"/><line x1="40" y1="224" x2="200" y2="224" stroke="#dce4e7"/><text x="56" y="201" class="tag">ENTITY</text><text x="56" y="216" class="name">products</text><text x="56" y="246" class="key"># id</text><text x="56" y="270" class="field">price</text><text x="56" y="294" class="field">pricing_policy</text><text x="56" y="318" class="field">active</text>
<!-- order items --> <rect class="join" x="300" y="184" width="160" height="160" rx="6"/><rect class="head" x="300" y="184" width="160" height="40" rx="6"/><rect class="head" x="300" y="216" width="160" height="8"/><line x1="300" y1="224" x2="460" y2="224" stroke="#dce4e7"/><text x="316" y="201" class="tag">LINE ITEMS</text><text x="316" y="216" class="name">order_items</text><text x="316" y="246" class="key"># id</text><text x="316" y="270" class="field">→ product_id</text><text x="316" y="294" class="field">quantity</text><text x="316" y="318" class="field">price_snapshot</text>
<!-- orders focal --> <rect class="core" x="600" y="184" width="160" height="160" rx="6"/><rect class="corehead" x="600" y="184" width="160" height="40" rx="6"/><rect class="corehead" x="600" y="216" width="160" height="8"/><line x1="600" y1="224" x2="760" y2="224" stroke="#9dc5d6"/><text x="616" y="201" class="tag" fill="#165e83">AGGREGATE</text><text x="616" y="216" class="name">orders</text><text x="616" y="246" class="key"># id</text><text x="616" y="270" class="field">status</text><text x="616" y="294" class="field">total_amount</text><text x="616" y="318" class="field">expires_at</text>
<!-- inventory --> <rect class="entity" x="40" y="384" width="160" height="160" rx="6"/><rect class="head" x="40" y="384" width="160" height="40" rx="6"/><rect class="head" x="40" y="416" width="160" height="8"/><line x1="40" y1="424" x2="200" y2="424" stroke="#dce4e7"/><text x="56" y="401" class="tag">ENTITY</text><text x="56" y="416" class="name">inventories</text><text x="56" y="446" class="key"># product_id</text><text x="56" y="470" class="field">available</text><text x="56" y="494" class="field">reserved</text><text x="56" y="518" class="field">sold</text>
<!-- payments --> <rect class="entity" x="600" y="384" width="160" height="160" rx="6"/><rect class="head" x="600" y="384" width="160" height="40" rx="6"/><rect class="head" x="600" y="416" width="160" height="8"/><line x1="600" y1="424" x2="760" y2="424" stroke="#dce4e7"/><text x="616" y="401" class="tag">ATTEMPT</text><text x="616" y="416" class="name">payments</text><text x="616" y="446" class="key"># id</text><text x="616" y="470" class="field">→ order_id</text><text x="616" y="494" class="field">status</text><text x="616" y="518" class="field">amount</text>
<!-- events --> <rect class="join" x="800" y="384" width="120" height="160" rx="6"/><rect class="head" x="800" y="384" width="120" height="40" rx="6"/><rect class="head" x="800" y="416" width="120" height="8"/><line x1="800" y1="424" x2="920" y2="424" stroke="#dce4e7"/><text x="816" y="401" class="tag">AUDIT</text><text x="816" y="416" class="name">events</text><text x="816" y="446" class="key"># id</text><text x="816" y="470" class="field">payload</text><text x="816" y="494" class="field">processed_at</text>
<!-- legend strip --> <line x1="40" y1="568" x2="920" y2="568" stroke="#dce4e7"/><text x="40" y="586" class="tag">LEGEND</text><rect x="122" y="577" width="14" height="10" rx="2" fill="#eaf1f4" stroke="#165e83"/><text x="144" y="586" class="legend">Aggregate root</text><rect x="278" y="577" width="14" height="10" rx="2" fill="#fff" stroke="#203b55"/><text x="300" y="586" class="legend">Entity</text><rect x="380" y="577" width="14" height="10" rx="2" fill="rgba(32,59,85,.03)" stroke="#6b7980" stroke-dasharray="3 2"/><text x="402" y="586" class="legend">Dependent record</text><text x="540" y="586" class="legend">1 / N shows cardinality</text>
</svg></div></body></html>
