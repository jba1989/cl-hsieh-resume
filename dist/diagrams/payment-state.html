<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>付款狀態機</title><style>
:root{--paper:#f7f5ef;--ink:#203b55;--muted:#6b7980;--accent:#165e83;--tint:#eaf1f4;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:var(--sans)}.diagram-container{width:100%;overflow-x:auto}.diagram-container svg{display:block;width:100%;min-width:960px}@media print{.diagram-container{overflow:visible}.diagram-container svg{min-width:0}}.edge{fill:none;stroke:var(--muted);stroke-width:1.25;marker-end:url(#a)}.primary{fill:none;stroke:var(--accent);stroke-width:1.6;marker-end:url(#b)}.state{fill:#fff;stroke:var(--ink);stroke-width:1.2}.active{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}.end{fill:rgba(22,94,131,.08);stroke:var(--accent);stroke-width:1.4}.tag{font:8px var(--mono);letter-spacing:1.3px;fill:var(--muted)}.name{font:600 14px var(--sans);fill:var(--ink)}.sub{font:10px var(--mono);fill:var(--muted)}.lab{font:8px var(--mono);letter-spacing:.7px;fill:var(--accent)}
</style></head><body><div class="diagram-container"><svg viewBox="0 0 960 600" role="img" aria-labelledby="payment-state-title payment-state-desc" xmlns="http://www.w3.org/2000/svg"><title id="payment-state-title">付款狀態機</title><desc id="payment-state-desc">付款處理走向成功或失敗；網路中斷時進入未知狀態，待 webhook 或對帳收斂。</desc><defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7980"/></marker><marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#165e83"/></marker></defs><rect width="960" height="600" fill="#f7f5ef"/><text x="40" y="44" class="tag">STATE MACHINE / LIFECYCLE PHASE MAP</text><text x="40" y="72" class="name" style="font-size:20px">付款狀態</text><text x="40" y="116" class="tag">PRIMARY PHASE</text><text x="40" y="338" class="tag">RECOVERY + TERMINAL OUTCOMES</text>
<line class="primary" x1="106" y1="220" x2="220" y2="220"/><line class="primary" x1="400" y1="220" x2="560" y2="220"/><path class="edge" d="M 310 280 V 408 H 210"/><path class="edge" d="M 310 408 H 560"/><path class="edge" d="M 400 408 V 448 H 650"/><rect x="430" y="194" width="90" height="14" rx="2" fill="#f7f5ef"/><text x="475" y="204" text-anchor="middle" class="lab">SUCCEEDED</text><rect x="326" y="330" width="74" height="14" rx="2" fill="#f7f5ef"/><text x="363" y="340" text-anchor="middle" class="lab">TIMEOUT</text><rect x="472" y="392" width="92" height="14" rx="2" fill="#f7f5ef"/><text x="518" y="402" text-anchor="middle" class="lab">CONFIRMED FAIL</text><rect x="474" y="434" width="94" height="14" rx="2" fill="#f7f5ef"/><text x="521" y="444" text-anchor="middle" class="lab">WEBHOOK / RECONCILE</text>
<circle cx="94" cy="220" r="6" fill="#203b55"/><rect class="active" x="220" y="160" width="180" height="120" rx="8"/><text x="240" y="190" class="tag">ACTIVE STATE</text><text x="240" y="222" class="name">PROCESSING</text><text x="240" y="246" class="sub">提交後才呼叫金流</text><text x="240" y="264" class="sub">不持有資料庫鎖</text><rect class="end" x="560" y="160" width="180" height="120" rx="8"/><text x="580" y="190" class="tag" fill="#165e83">TERMINAL</text><text x="580" y="226" class="name">SUCCEEDED</text><text x="580" y="250" class="sub">唯一成功付款結果</text><rect class="state" x="40" y="368" width="170" height="80" rx="8"/><text x="60" y="398" class="tag">RECOVERY</text><text x="60" y="426" class="name">UNKNOWN</text><text x="60" y="442" class="sub">等待外部事實</text><rect class="state" x="560" y="368" width="170" height="80" rx="8"/><text x="580" y="398" class="tag">TERMINAL</text><text x="580" y="426" class="name">FAILED</text><text x="580" y="442" class="sub">失敗已確認</text><line x1="40" y1="568" x2="920" y2="568" stroke="#dce4e7"/><text x="40" y="586" class="tag">READING KEY</text><text x="160" y="586" class="sub">indigo = primary success path</text><text x="372" y="586" class="sub">muted = recovery or terminal transition</text>
</svg></div></body></html>
