<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結帳主流程</title><style>
:root{--paper:#f7f5ef;--ink:#203b55;--muted:#6b7980;--accent:#165e83;--accent-tint:#eaf1f4;--rule:#dce4e7;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:var(--sans)}.diagram-container{width:100%;overflow-x:auto}.diagram-container svg{display:block;width:100%;min-width:960px}@media print{.diagram-container{overflow:visible}.diagram-container svg{min-width:0}}.edge{fill:none;stroke:var(--muted);stroke-width:1.25;marker-end:url(#arrow)}.accent{fill:none;stroke:var(--accent);stroke-width:1.6;marker-end:url(#arrow-accent)}.step{fill:#fff;stroke:var(--ink);stroke-width:1.2}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5}.terminal{fill:rgba(22,94,131,.08);stroke:var(--accent);stroke-width:1.4}.tag{font:8px var(--mono);letter-spacing:1.35px;fill:var(--muted)}.name{font:600 14px var(--sans);fill:var(--ink)}.sub{font:10px var(--mono);fill:var(--muted)}.label{font:8px var(--mono);letter-spacing:.9px;fill:var(--accent)}.legend{font:8.5px var(--sans);fill:var(--muted)}
</style></head><body><div class="diagram-container"><svg viewBox="0 0 960 600" role="img" aria-labelledby="checkout-flow-title checkout-flow-desc" xmlns="http://www.w3.org/2000/svg"><title id="checkout-flow-title">結帳主流程</title><desc id="checkout-flow-desc">從建立訂單與保留庫存開始，付款結果分流為已付款、失敗取消與待對帳三種可追蹤結果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7980"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#165e83"/></marker></defs>
<rect width="960" height="600" fill="#f7f5ef"/><text x="40" y="44" class="tag">FLOWCHART / CHECKOUT HAPPY PATH + EXCEPTIONS</text><text x="40" y="72" class="name" style="font-size:20px">從訂單建立到付款收斂</text>
<!-- arrows: separated routes, before nodes -->
<line class="accent" x1="480" y1="128" x2="480" y2="168"/><line class="accent" x1="480" y1="232" x2="480" y2="268"/><line class="accent" x1="480" y1="332" x2="480" y2="356"/><line class="accent" x1="576" y1="404" x2="696" y2="404"/>
<path class="edge" d="M 480 452 V 480 H 320"/><path class="edge" d="M 480 452 V 520 H 696"/><path class="edge" d="M 456 404 H 320"/>
<!-- labels are masked and kept 8px clear of their strokes -->
<rect x="492" y="244" width="82" height="14" rx="2" fill="#f7f5ef"/><text x="533" y="254" text-anchor="middle" class="label">ATOMIC HOLD</text><rect x="592" y="384" width="40" height="14" rx="2" fill="#f7f5ef"/><text x="612" y="394" text-anchor="middle" class="label">YES</text><rect x="492" y="462" width="26" height="14" rx="2" fill="#f7f5ef"/><text x="505" y="472" text-anchor="middle" class="label">NO</text><rect x="554" y="502" width="60" height="14" rx="2" fill="#f7f5ef"/><text x="584" y="512" text-anchor="middle" class="label">UNKNOWN</text>
<!-- start --> <rect x="380" y="80" width="200" height="48" rx="20" fill="rgba(32,59,85,.03)" stroke="#6b7980"/><text x="480" y="109" text-anchor="middle" class="name">送出結帳請求</text>
<!-- order --> <rect class="step" x="360" y="168" width="240" height="64" rx="6"/><text x="380" y="190" class="tag">ORDER</text><text x="380" y="214" class="name">建立訂單、快照價格、保留庫存</text>
<!-- payment --> <rect class="focus" x="360" y="268" width="240" height="64" rx="6"/><text x="380" y="290" class="tag" fill="#165e83">PAYMENT</text><text x="380" y="314" class="name">提交後發起付款</text>
<!-- decision --> <polygon points="480,356 576,404 480,452 384,404" fill="#fff" stroke="#203b55" stroke-width="1.2"/><text x="480" y="401" text-anchor="middle" class="name">付款成功？</text><text x="480" y="420" text-anchor="middle" class="sub">CAS 狀態轉換</text>
<!-- terminals / recovery --> <rect class="terminal" x="696" y="372" width="180" height="64" rx="20"/><text x="786" y="400" text-anchor="middle" class="tag" fill="#165e83">COMPLETE</text><text x="786" y="420" text-anchor="middle" class="name">PAID</text>
<rect class="step" x="120" y="448" width="200" height="64" rx="6"/><text x="140" y="470" class="tag">KNOWN FAILURE</text><text x="140" y="494" class="name">失敗或逾時 → 取消訂單</text>
<rect class="step" x="696" y="488" width="180" height="64" rx="6"/><text x="716" y="510" class="tag">RECOVERY</text><text x="716" y="534" class="name">等待 webhook／對帳</text>
<line x1="40" y1="568" x2="920" y2="568" stroke="#dce4e7"/><text x="40" y="586" class="tag">READING KEY</text><line x1="150" y1="582" x2="180" y2="582" stroke="#165e83" stroke-width="1.6" marker-end="url(#arrow-accent)"/><text x="190" y="586" class="legend">primary path</text><line x1="300" y1="582" x2="330" y2="582" stroke="#6b7980" stroke-width="1.2" marker-end="url(#arrow)"/><text x="340" y="586" class="legend">exception / recovery</text><text x="500" y="586" class="legend">Shapes distinguish start, action, decision and terminal state</text>
</svg></div></body></html>
