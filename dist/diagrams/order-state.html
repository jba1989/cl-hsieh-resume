<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>訂單狀態機</title><style>
:root{--paper:#f7f5ef;--ink:#203b55;--muted:#6b7980;--accent:#165e83;--tint:#eaf1f4;--rule:#dce4e7;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:var(--sans)}.diagram-container{width:100%;overflow-x:auto}.diagram-container svg{display:block;width:100%;min-width:960px}@media print{.diagram-container{overflow:visible}.diagram-container svg{min-width:0}}.edge{fill:none;stroke:var(--muted);stroke-width:1.25;marker-end:url(#a)}.primary{fill:none;stroke:var(--accent);stroke-width:1.6;marker-end:url(#b)}.state{fill:#fff;stroke:var(--ink);stroke-width:1.2}.active{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}.end{fill:rgba(22,94,131,.08);stroke:var(--accent);stroke-width:1.4}.tag{font:8px var(--mono);letter-spacing:1.3px;fill:var(--muted)}.name{font:600 14px var(--sans);fill:var(--ink)}.sub{font:10px var(--mono);fill:var(--muted)}.lab{font:8px var(--mono);letter-spacing:.7px;fill:var(--accent)}
</style></head><body><div class="diagram-container"><svg viewBox="0 0 960 600" role="img" aria-labelledby="order-state-title order-state-desc" xmlns="http://www.w3.org/2000/svg"><title id="order-state-title">訂單狀態機</title><desc id="order-state-desc">訂單在待付款主線上收斂為已付款，或因使用者取消與逾時進入取消狀態。</desc><defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7980"/></marker><marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#165e83"/></marker></defs><rect width="960" height="600" fill="#f7f5ef"/><text x="40" y="44" class="tag">STATE MACHINE / LIFECYCLE PHASE MAP</text><text x="40" y="72" class="name" style="font-size:20px">訂單狀態</text><text x="40" y="116" class="tag">PRIMARY PHASE</text><text x="40" y="338" class="tag">TERMINAL OUTCOME</text>
<line class="primary" x1="106" y1="220" x2="220" y2="220"/><line class="primary" x1="400" y1="220" x2="560" y2="220"/><line class="edge" x1="310" y1="280" x2="310" y2="408"/><path class="edge" d="M 310 408 H 650"/><rect x="430" y="194" width="100" height="14" rx="2" fill="#f7f5ef"/><text x="480" y="204" text-anchor="middle" class="lab">PAYMENT CONFIRMED</text><rect x="324" y="330" width="112" height="14" rx="2" fill="#f7f5ef"/><text x="380" y="340" text-anchor="middle" class="lab">CANCEL / TIMEOUT</text>

<rect class="state" x="650" y="368" width="180" height="80" rx="8"/><text x="670" y="398" class="tag">TERMINAL</text><text x="670" y="426" class="name">CANCELLED</text><text x="670" y="442" class="sub">釋放保留庫存</text><line x1="40" y1="568" x2="920" y2="568" stroke="#dce4e7"/><text x="40" y="586" class="tag">READING KEY</text><circle cx="160" cy="582" r="5" fill="#203b55"/><text x="174" y="586" class="sub">initial</text><rect x="258" y="577" width="14" height="10" rx="2" fill="#eaf1f4" stroke="#165e83"/><text x="282" y="586" class="sub">active</text><rect x="370" y="577" width="14" height="10" rx="2" fill="rgba(22,94,131,.08)" stroke="#165e83"/><text x="394" y="586" class="sub">terminal</text>
</svg></div></body></html>
