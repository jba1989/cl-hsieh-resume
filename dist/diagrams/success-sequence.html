<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>付款成功時序</title><style>
:root{--paper:#f7f5ef;--ink:#203b55;--muted:#6b7980;--accent:#165e83;--tint:#eaf1f4;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:var(--sans)}.diagram-container{width:100%;overflow-x:auto}.diagram-container svg{display:block;width:100%;min-width:960px}@media print{.diagram-container{overflow:visible}.diagram-container svg{min-width:0}}.actor{fill:#fff;stroke:var(--ink);stroke-width:1.2}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.4}.life{stroke:rgba(32,59,85,.24);stroke-width:1;stroke-dasharray:3 3}.active{fill:rgba(32,59,85,.06);stroke:var(--muted);stroke-width:.8}.call{stroke:var(--muted);stroke-width:1.2;marker-end:url(#a)}.return{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:5 4;marker-end:url(#a)}.success{stroke:var(--accent);stroke-width:1.6;marker-end:url(#b)}.tag{font:8px var(--mono);letter-spacing:1.2px;fill:var(--muted)}.name{font:600 13px var(--sans);fill:var(--ink)}.sub{font:9px var(--mono);fill:var(--muted)}.msg{font:8px var(--mono);letter-spacing:.5px;fill:var(--muted)}.ok{fill:var(--accent)}
</style></head><body><div class="diagram-container"><svg viewBox="0 0 960 600" role="img" aria-labelledby="success-sequence-title success-sequence-desc" xmlns="http://www.w3.org/2000/svg"><title id="success-sequence-title">下單與付款成功時序</title><desc id="success-sequence-desc">前端建立訂單與保留庫存，接著呼叫金流；成功結果確認後，系統將付款與訂單狀態寫入資料庫。</desc><defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7980"/></marker><marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#165e83"/></marker></defs><rect width="960" height="600" fill="#f7f5ef"/><text x="40" y="44" class="tag">SEQUENCE / SUCCESSFUL PAYMENT</text><text x="40" y="72" class="name" style="font-size:20px">下單到付款成功</text>
<!-- lifelines + active ownership --> <line class="life" x1="140" y1="160" x2="140" y2="500"/><line class="life" x1="360" y1="160" x2="360" y2="500"/><line class="life" x1="590" y1="160" x2="590" y2="500"/><line class="life" x1="810" y1="160" x2="810" y2="500"/><rect class="active" x="356" y="198" width="8" height="258"/><rect class="active" x="586" y="254" width="8" height="164"/>
<!-- messages: time flows down --> <line class="call" x1="140" y1="200" x2="356" y2="200"/><line class="call" x1="364" y1="256" x2="586" y2="256"/><line class="return" x1="586" y1="304" x2="364" y2="304"/><line class="return" x1="356" y1="348" x2="140" y2="348"/><line class="call" x1="140" y1="392" x2="356" y2="392"/><line class="call" x1="364" y1="432" x2="810" y2="432"/><line class="return" x1="810" y1="472" x2="364" y2="472"/><line class="success" x1="356" y1="512" x2="586" y2="512"/>
<!-- labels are masked, with an 8px gap above their line --> <rect x="190" y="180" width="106" height="14" rx="2" fill="#f7f5ef"/><text x="243" y="190" text-anchor="middle" class="msg">CREATE ORDER</text><rect x="420" y="236" width="112" height="14" rx="2" fill="#f7f5ef"/><text x="476" y="246" text-anchor="middle" class="msg">BEGIN · RESERVE</text><rect x="440" y="284" width="72" height="14" rx="2" fill="#f7f5ef"/><text x="476" y="294" text-anchor="middle" class="msg">COMMIT</text><rect x="186" y="328" width="116" height="14" rx="2" fill="#f7f5ef"/><text x="244" y="338" text-anchor="middle" class="msg">201 PENDING</text><rect x="196" y="372" width="94" height="14" rx="2" fill="#f7f5ef"/><text x="243" y="382" text-anchor="middle" class="msg">PAY NOW</text><rect x="532" y="412" width="108" height="14" rx="2" fill="#f7f5ef"/><text x="586" y="422" text-anchor="middle" class="msg">CHARGE (NO LOCK)</text><rect x="562" y="452" width="96" height="14" rx="2" fill="#f7f5ef"/><text x="610" y="462" text-anchor="middle" class="msg">SUCCEEDED</text><rect x="424" y="492" width="98" height="14" rx="2" fill="#f7f5ef"/><text x="473" y="502" text-anchor="middle" class="msg ok">確認付款成功</text>
<!-- participants --> <rect class="actor" x="76" y="112" width="128" height="48" rx="6"/><rect class="actor" x="296" y="112" width="128" height="48" rx="6"/><rect class="focus" x="526" y="112" width="128" height="48" rx="6"/><rect class="actor" x="746" y="112" width="128" height="48" rx="6"/><text x="140" y="138" text-anchor="middle" class="name">前端</text><text x="360" y="138" text-anchor="middle" class="name">API</text><text x="590" y="138" text-anchor="middle" class="name">PostgreSQL</text><text x="810" y="138" text-anchor="middle" class="name">Mock 金流</text><text x="140" y="153" text-anchor="middle" class="sub">Vue SPA</text><text x="360" y="153" text-anchor="middle" class="sub">Laravel</text><text x="590" y="153" text-anchor="middle" class="sub">source of truth</text><text x="810" y="153" text-anchor="middle" class="sub">external adapter</text>
<line x1="40" y1="552" x2="920" y2="552" stroke="#dce4e7"/><text x="40" y="574" class="tag">READING KEY</text><line x1="152" y1="570" x2="182" y2="570" class="return"/><text x="192" y="574" class="sub">dashed = return</text><line x1="326" y1="570" x2="356" y2="570" class="success"/><text x="366" y="574" class="sub">indigo = confirmed success</text>
</svg></div></body></html>
